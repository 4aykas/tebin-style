name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release
jobs:
  # Verifies and packs with a read-only token. Nothing here can write to the repo.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check release tag and changelog
        run: node scripts/check-release.mjs
      - run: pnpm install --frozen-lockfile
      # verify runs before packing, so a release never ships a stale tree.
      - run: pnpm verify
      - run: pnpm pack:brand
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            .tmp/tebin-brand-pack.zip
            .tmp/tebin-style-skill.zip
          if-no-files-found: error

  # Publishes what build produced. No checkout, no install, no repo code runs here.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*.zip
      - name: Write SHA-256 checksums
        working-directory: release-assets
        run: for f in *.zip; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
